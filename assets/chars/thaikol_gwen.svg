<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Spider-Gwen">
<style>
  
  .upper{animation:upArt 0.9s ease-in-out infinite alternate;transform-origin:130px 138px}
  .lower{animation:loArt 0.9s ease-in-out infinite alternate;transform-origin:130px 138px}
  @keyframes upArt{0%{transform:rotate(-7deg) translateY(2px)}100%{transform:rotate(7deg) translateY(-3px)}}
  @keyframes loArt{0%{transform:rotate(9deg)}100%{transform:rotate(-9deg)}}
  .spin{animation:sp 7s linear infinite;transform-origin:130px 130px}
  .spinR{animation:spR 9s linear infinite;transform-origin:130px 130px}
  @keyframes sp{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes spR{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
  .pulseAura{animation:pA 2.2s ease-in-out infinite;transform-origin:130px 130px}
  @keyframes pA{0%,100%{opacity:0.45;transform:scale(0.92)}50%{opacity:0.9;transform:scale(1.08)}}
  .zap1{animation:z1 0.75s ease-in-out infinite}
  .zap2{animation:z1 0.75s ease-in-out infinite;animation-delay:-0.38s}
  @keyframes z1{0%,100%{opacity:0.08;transform:scale(0.9)}50%{opacity:1;transform:scale(1.06)}}
  .shot{stroke-dasharray:65;animation:sh 0.75s linear infinite}
  @keyframes sh{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
  .glitch{animation:gl 1.4s steps(2,end) infinite}
  @keyframes gl{0%,100%{opacity:0;transform:translateX(0)}20%{opacity:0.85;transform:translateX(-6px)}40%{opacity:0;transform:translateX(6px)}60%{opacity:0.7;transform:translateX(4px)}}

  
  .macro{animation:mGw 1.85s ease-in-out infinite;transform-origin:132px 6px}
  @keyframes mGw{0%,100%{transform:rotate(18deg) translate(-12px, 4px)}50%{transform:rotate(-20deg) translate(16px, -10px)}}
</style>

  <defs>
    <radialGradient id="gGw"><stop offset="0" stop-color="#EC4899" stop-opacity="0.40"/><stop offset="0.55" stop-color="#06B6D4" stop-opacity="0.20"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
  </defs>
  <circle class="pulseAura" cx="130" cy="130" r="98" fill="url(#gGw)"/>
  <g class="spin">
    <ellipse cx="130" cy="132" rx="92" ry="36" fill="none" stroke="#EC4899" stroke-width="2.4" stroke-dasharray="20 8" stroke-opacity="0.7"/>
  </g>
  <g class="spinR">
    <ellipse cx="130" cy="132" rx="36" ry="92" fill="none" stroke="#06B6D4" stroke-width="2.0" stroke-dasharray="16 10" stroke-opacity="0.65"/>
  </g>
  <g class="glitch">
    <rect x="36" y="64" width="38" height="4" rx="2" fill="#EC4899"/>
    <rect x="182" y="168" width="42" height="4" rx="2" fill="#06B6D4"/>
  </g>
<g class="macro">
  <line x1="132" y1="-10" x2="132" y2="42" stroke="#EC4899" stroke-width="2.4"/>
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  
  <path class="zap1" d="M52 108 l7 -3 l3 -7 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 Z" fill="#EC4899"/>
  <path class="zap2" d="M194 92 l7 -3 l3 -7 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 Z" fill="#06B6D4"/>
</g>
</svg>