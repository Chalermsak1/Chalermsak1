<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Spider-Gwen">
<style>
  
  .macro{animation:mGw 1.9s ease-in-out infinite;transform-origin:132px 6px}
  @keyframes mGw{
    0%,100%{transform:rotate(19deg) translate(-14px, 4px)}
    50%{transform:rotate(-21deg) translate(16px, -12px)}
  }
  .upper{animation:upArt 0.92s ease-in-out infinite alternate;transform-origin:129px 139px}
  .lower{animation:loArt 0.92s ease-in-out infinite alternate;transform-origin:129px 139px}
  @keyframes upArt{
    0%{transform:rotate(-7deg) translateY(2px)}
    100%{transform:rotate(7deg) translateY(-3px)}
  }
  @keyframes loArt{
    0%{transform:rotate(9deg)}
    100%{transform:rotate(-9deg)}
  }
  .vfx{animation:vf 0.9s ease-in-out infinite}
  @keyframes vf{0%,100%{opacity:0.15;transform:scale(0.92)}50%{opacity:0.95;transform:scale(1.08)}}
  .shot{stroke-dasharray:55;animation:sh 0.85s linear infinite}
  @keyframes sh{from{stroke-dashoffset:110}to{stroke-dashoffset:0}}
  .ring{animation:rg 2.8s linear infinite;transform-origin:130px 135px}
  @keyframes rg{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
<g class="macro">
  <ellipse class="ring" cx="130" cy="135" rx="84" ry="28" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="14 8" stroke-opacity="0.5"/><line x1="132" y1="-10" x2="132" y2="42" stroke="#CBD5E1" stroke-width="2.2"/>
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  
</g>
</svg>