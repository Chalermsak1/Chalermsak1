<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Spider-Man Noir">
<style>
  
  .upper{animation:upArt 0.9s ease-in-out infinite alternate;transform-origin:140px 125px}
  .lower{animation:loArt 0.9s ease-in-out infinite alternate;transform-origin:140px 125px}
  @keyframes upArt{0%{transform:rotate(-7deg) translateY(2px)}100%{transform:rotate(7deg) translateY(-3px)}}
  @keyframes loArt{0%{transform:rotate(9deg)}100%{transform:rotate(-9deg)}}
  .spin{animation:sp 7s linear infinite;transform-origin:130px 130px}
  .spinR{animation:spR 9s linear infinite;transform-origin:130px 130px}
  @keyframes sp{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes spR{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
  .pulseAura{animation:pA 2.2s ease-in-out infinite;transform-origin:130px 130px}
  @keyframes pA{0%,100%{opacity:0.45;transform:scale(0.92)}50%{opacity:0.9;transform:scale(1.08)}}
  .zap1{animation:z1 0.75s ease-in-out infinite}
  .zap2{animation:z1 0.75s ease-in-out infinite;animation-delay:-0.38s}
  @keyframes z1{0%,100%{opacity:0.08;transform:scale(0.9)}50%{opacity:1;transform:scale(1.06)}}
  .shot{stroke-dasharray:65;animation:sh 0.75s linear infinite}
  @keyframes sh{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
  .glitch{animation:gl 1.4s steps(2,end) infinite}
  @keyframes gl{0%,100%{opacity:0;transform:translateX(0)}20%{opacity:0.85;transform:translateX(-6px)}40%{opacity:0;transform:translateX(6px)}60%{opacity:0.7;transform:translateX(4px)}}

  
  .macro{animation:mNoir 1.85s ease-in-out infinite;transform-origin:130px 185px}
  @keyframes mNoir{0%,100%{transform:translate(-12px, 6px) rotate(-6deg) scale(0.97)}50%{transform:translate(12px, -14px) rotate(6deg) scale(1.04)}}
</style>

  <defs>
    <radialGradient id="gNoir"><stop offset="0" stop-color="#475569" stop-opacity="0.42"/><stop offset="0.65" stop-color="#EF4444" stop-opacity="0.14"/><stop offset="1" stop-color="#0F172A" stop-opacity="0"/></radialGradient>
  </defs>
  <circle class="pulseAura" cx="130" cy="130" r="96" fill="url(#gNoir)"/>
  <!-- SOC Detective Radar Reticle & Falling Rain -->
  <g class="spin">
    <circle cx="130" cy="130" r="88" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="22 8 4 8" stroke-opacity="0.6"/>
    <line x1="130" y1="34" x2="130" y2="52" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="130" y1="208" x2="130" y2="226" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="34" y1="130" x2="52" y2="130" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="208" y1="130" x2="226" y2="130" stroke="#EF4444" stroke-width="2.5"/>
  </g>
  <line class="shot" x1="55" y1="25" x2="35" y2="195" stroke="#94A3B8" stroke-width="1.6" stroke-opacity="0.55"/>
  <line class="shot" x1="215" y1="35" x2="195" y2="205" stroke="#94A3B8" stroke-width="1.6" stroke-opacity="0.55"/>
<g class="macro">
  
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  
  <!-- Dramatic Noir Spider-Sense & Threat Lock -->
  <path class="zap1" d="M84 42 q-16 -10 -4 -24 M176 42 q16 -10 4 -24 M68 54 q-20 -8 -8 -26 M192 54 q20 -8 8 -26" fill="none" stroke="#EF4444" stroke-width="2.6" stroke-linecap="round"/>
  <circle class="zap2" cx="130" cy="115" r="22" fill="none" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="8 5"/>
</g>
</svg>