<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Classic Spider-Man">
<style>
  
  .upper{animation:upArt 0.9s ease-in-out infinite alternate;transform-origin:113px 133px}
  .lower{animation:loArt 0.9s ease-in-out infinite alternate;transform-origin:113px 133px}
  @keyframes upArt{0%{transform:rotate(-7deg) translateY(2px)}100%{transform:rotate(7deg) translateY(-3px)}}
  @keyframes loArt{0%{transform:rotate(9deg)}100%{transform:rotate(-9deg)}}
  .spin{animation:sp 7s linear infinite;transform-origin:130px 130px}
  .spinR{animation:spR 9s linear infinite;transform-origin:130px 130px}
  @keyframes sp{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes spR{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
  .pulseAura{animation:pA 2.2s ease-in-out infinite;transform-origin:130px 130px}
  @keyframes pA{0%,100%{opacity:0.45;transform:scale(0.92)}50%{opacity:0.9;transform:scale(1.08)}}
  .zap1{animation:z1 0.75s ease-in-out infinite}
  .zap2{animation:z1 0.75s ease-in-out infinite;animation-delay:-0.38s}
  @keyframes z1{0%,100%{opacity:0.08;transform:scale(0.9)}50%{opacity:1;transform:scale(1.06)}}
  .shot{stroke-dasharray:65;animation:sh 0.75s linear infinite}
  @keyframes sh{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
  .glitch{animation:gl 1.4s steps(2,end) infinite}
  @keyframes gl{0%,100%{opacity:0;transform:translateX(0)}20%{opacity:0.85;transform:translateX(-6px)}40%{opacity:0;transform:translateX(6px)}60%{opacity:0.7;transform:translateX(4px)}}

  
  .macro{animation:mSwR 1.7s ease-in-out infinite;transform-origin:195px 0px}
  @keyframes mSwR{0%,100%{transform:rotate(-19deg) translate(14px, 6px)}50%{transform:rotate(20deg) translate(-18px, -12px)}}
</style>

  <defs>
    <radialGradient id="gFl"><stop offset="0" stop-color="#2563EB" stop-opacity="0.38"/><stop offset="0.6" stop-color="#06B6D4" stop-opacity="0.16"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
  </defs>
  <circle class="pulseAura" cx="130" cy="130" r="98" fill="url(#gFl)"/>
  <!-- Geospatial Flood Radar Web -->
  <g class="spinR">
    <circle cx="130" cy="130" r="88" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="14 6" stroke-opacity="0.55"/>
    <circle cx="130" cy="130" r="64" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="8 8" stroke-opacity="0.5"/>
    <line x1="42" y1="130" x2="218" y2="130" stroke="#2563EB" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="130" y1="42" x2="130" y2="218" stroke="#2563EB" stroke-width="1" stroke-opacity="0.35"/>
  </g>
<g class="macro">
  <line x1="195" y1="-10" x2="113" y2="133" stroke="#64748B" stroke-width="2.4" stroke-dasharray="5 3"/>
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  
  <!-- Twin Braided Web Shot & Classic Golden Spider-Sense -->
  <line class="shot" x1="88" y1="112" x2="12" y2="178" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
  <line class="shot" x1="92" y1="116" x2="18" y2="184" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path class="zap1" d="M98 46 l-10 -16 l14 8 l-4 -16 M148 42 l10 -16 l-14 8 l4 -16" fill="none" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round"/>
</g>
</svg>