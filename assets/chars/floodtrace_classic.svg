<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Classic Spider-Man">
<style>
  
  .macro{animation:mSwR 1.75s ease-in-out infinite;transform-origin:195px 0px}
  @keyframes mSwR{
    0%,100%{transform:rotate(-20deg) translate(16px, 6px)}
    50%{transform:rotate(22deg) translate(-20px, -14px)}
  }
  .upper{animation:upArt 0.92s ease-in-out infinite alternate;transform-origin:112px 133px}
  .lower{animation:loArt 0.92s ease-in-out infinite alternate;transform-origin:112px 133px}
  @keyframes upArt{
    0%{transform:rotate(-7deg) translateY(2px)}
    100%{transform:rotate(7deg) translateY(-3px)}
  }
  @keyframes loArt{
    0%{transform:rotate(9deg)}
    100%{transform:rotate(-9deg)}
  }
  .vfx{animation:vf 0.9s ease-in-out infinite}
  @keyframes vf{0%,100%{opacity:0.15;transform:scale(0.92)}50%{opacity:0.95;transform:scale(1.08)}}
  .shot{stroke-dasharray:55;animation:sh 0.85s linear infinite}
  @keyframes sh{from{stroke-dashoffset:110}to{stroke-dashoffset:0}}
  .ring{animation:rg 2.8s linear infinite;transform-origin:130px 135px}
  @keyframes rg{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
<g class="macro">
  <line x1="195" y1="-10" x2="112" y2="133" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="5 3"/>
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <line class="shot" x1="85" y1="115" x2="10" y2="175" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
</g>
</svg>