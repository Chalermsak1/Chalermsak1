<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Peter B. Parker">
<style>
  
  .macro{animation:mHs 1.85s ease-in-out infinite;transform-origin:130px 190px}
  @keyframes mHs{
    0%,100%{transform:translate(-14px, 8px) rotate(-7deg) scale(0.96)}
    50%{transform:translate(14px, -16px) rotate(7deg) scale(1.05)}
  }
  .upper{animation:upArt 0.92s ease-in-out infinite alternate;transform-origin:139px 125px}
  .lower{animation:loArt 0.92s ease-in-out infinite alternate;transform-origin:139px 125px}
  @keyframes upArt{
    0%{transform:rotate(-7deg) translateY(2px)}
    100%{transform:rotate(7deg) translateY(-3px)}
  }
  @keyframes loArt{
    0%{transform:rotate(9deg)}
    100%{transform:rotate(-9deg)}
  }
  .vfx{animation:vf 0.9s ease-in-out infinite}
  @keyframes vf{0%,100%{opacity:0.15;transform:scale(0.92)}50%{opacity:0.95;transform:scale(1.08)}}
  .shot{stroke-dasharray:55;animation:sh 0.85s linear infinite}
  @keyframes sh{from{stroke-dashoffset:110}to{stroke-dashoffset:0}}
  .ring{animation:rg 2.8s linear infinite;transform-origin:130px 135px}
  @keyframes rg{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
<g class="macro">
  
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <path class="vfx" d="M82 38 q-14 -10 -4 -22 M178 38 q14 -10 4 -22 M68 50 q-18 -8 -8 -24 M192 50 q18 -8 8 -24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
</g>
</svg>