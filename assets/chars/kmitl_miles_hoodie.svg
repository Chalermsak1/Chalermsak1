<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Spider-Verse Miles Morales">
<style>
  
  .macro{animation:mPk 1.65s ease-in-out infinite;transform-origin:130px 130px}
  @keyframes mPk{
    0%,100%{transform:translate(-18px, 14px) rotate(-12deg) scale(0.94)}
    50%{transform:translate(18px, -18px) rotate(12deg) scale(1.06)}
  }
  .upper{animation:upArt 0.92s ease-in-out infinite alternate;transform-origin:130px 129px}
  .lower{animation:loArt 0.92s ease-in-out infinite alternate;transform-origin:130px 129px}
  @keyframes upArt{
    0%{transform:rotate(-7deg) translateY(2px)}
    100%{transform:rotate(7deg) translateY(-3px)}
  }
  @keyframes loArt{
    0%{transform:rotate(9deg)}
    100%{transform:rotate(-9deg)}
  }
  .vfx{animation:vf 0.9s ease-in-out infinite}
  @keyframes vf{0%,100%{opacity:0.15;transform:scale(0.92)}50%{opacity:0.95;transform:scale(1.08)}}
  .shot{stroke-dasharray:55;animation:sh 0.85s linear infinite}
  @keyframes sh{from{stroke-dashoffset:110}to{stroke-dashoffset:0}}
  .ring{animation:rg 2.8s linear infinite;transform-origin:130px 135px}
  @keyframes rg{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
<g class="macro">
  <line class="shot" x1="18" y1="195" x2="82" y2="150" stroke="#EF4444" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.65"/><line class="shot" x1="170" y1="100" x2="232" y2="55" stroke="#06B6D4" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.65"/>
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  
</g>
</svg>