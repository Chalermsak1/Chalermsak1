<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Spider-Verse Miles Morales">
<style>
  
  .upper{animation:upArt 0.9s ease-in-out infinite alternate;transform-origin:130px 129px}
  .lower{animation:loArt 0.9s ease-in-out infinite alternate;transform-origin:130px 129px}
  @keyframes upArt{0%{transform:rotate(-7deg) translateY(2px)}100%{transform:rotate(7deg) translateY(-3px)}}
  @keyframes loArt{0%{transform:rotate(9deg)}100%{transform:rotate(-9deg)}}
  .spin{animation:sp 7s linear infinite;transform-origin:130px 130px}
  .spinR{animation:spR 9s linear infinite;transform-origin:130px 130px}
  @keyframes sp{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes spR{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
  .pulseAura{animation:pA 2.2s ease-in-out infinite;transform-origin:130px 130px}
  @keyframes pA{0%,100%{opacity:0.45;transform:scale(0.92)}50%{opacity:0.9;transform:scale(1.08)}}
  .zap1{animation:z1 0.75s ease-in-out infinite}
  .zap2{animation:z1 0.75s ease-in-out infinite;animation-delay:-0.38s}
  @keyframes z1{0%,100%{opacity:0.08;transform:scale(0.9)}50%{opacity:1;transform:scale(1.06)}}
  .shot{stroke-dasharray:65;animation:sh 0.75s linear infinite}
  @keyframes sh{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
  .glitch{animation:gl 1.4s steps(2,end) infinite}
  @keyframes gl{0%,100%{opacity:0;transform:translateX(0)}20%{opacity:0.85;transform:translateX(-6px)}40%{opacity:0;transform:translateX(6px)}60%{opacity:0.7;transform:translateX(4px)}}

  
  .macro{animation:mPk 1.6s ease-in-out infinite;transform-origin:130px 130px}
  @keyframes mPk{0%,100%{transform:translate(-16px, 12px) rotate(-11deg) scale(0.95)}50%{transform:translate(16px, -16px) rotate(11deg) scale(1.06)}}
</style>

  <defs>
    <radialGradient id="gKm"><stop offset="0" stop-color="#EF4444" stop-opacity="0.40"/><stop offset="0.55" stop-color="#06B6D4" stop-opacity="0.20"/><stop offset="1" stop-color="#EF4444" stop-opacity="0"/></radialGradient>
  </defs>
  <circle class="pulseAura" cx="130" cy="130" r="98" fill="url(#gKm)"/>
  <g class="spin">
    <circle cx="130" cy="130" r="88" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-dasharray="22 10" stroke-opacity="0.65"/>
  </g>
  <line class="shot" x1="18" y1="202" x2="92" y2="148" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <line class="shot" x1="168" y1="104" x2="238" y2="48" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
  <g class="glitch">
    <rect x="30" y="88" width="44" height="5" rx="2.5" fill="#06B6D4"/>
    <rect x="180" y="162" width="48" height="5" rx="2.5" fill="#EF4444"/>
  </g>
<g class="macro">
  
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  
  <path class="zap1" d="M62 68 l18 -14 l-6 18 l18 -6 M195 135 l-18 14 l6 -18 l-18 6" fill="none" stroke="#FACC15" stroke-width="2.8" stroke-linecap="round"/>
</g>
</svg>