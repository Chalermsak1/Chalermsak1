<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Amazing Spider-Man">
<style>
  
  .macro{animation:mBg 1.95s ease-in-out infinite;transform-origin:130px 0px}
  @keyframes mBg{
    0%,100%{transform:translateY(-18px) rotate(-11deg)}
    25%{transform:translateY(4px) rotate(10deg)}
    50%{transform:translateY(22px) rotate(-9deg)}
    75%{transform:translateY(2px) rotate(11deg)}
  }
  .upper{animation:upArt 0.92s ease-in-out infinite alternate;transform-origin:129px 133px}
  .lower{animation:loArt 0.92s ease-in-out infinite alternate;transform-origin:129px 133px}
  @keyframes upArt{
    0%{transform:rotate(-7deg) translateY(2px)}
    100%{transform:rotate(7deg) translateY(-3px)}
  }
  @keyframes loArt{
    0%{transform:rotate(9deg)}
    100%{transform:rotate(-9deg)}
  }
  .vfx{animation:vf 0.9s ease-in-out infinite}
  @keyframes vf{0%,100%{opacity:0.15;transform:scale(0.92)}50%{opacity:0.95;transform:scale(1.08)}}
  .shot{stroke-dasharray:55;animation:sh 0.85s linear infinite}
  @keyframes sh{from{stroke-dashoffset:110}to{stroke-dashoffset:0}}
  .ring{animation:rg 2.8s linear infinite;transform-origin:130px 135px}
  @keyframes rg{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
<g class="macro">
  <line x1="130" y1="-25" x2="130" y2="55" stroke="#94A3B8" stroke-width="2.4"/>
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <path class="vfx" d="M72 185 q-14 8 0 18 M60 180 q-18 12 0 26 M188 185 q14 8 0 18 M200 180 q18 12 0 26" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/>
</g>
</svg>