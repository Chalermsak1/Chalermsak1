<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Amazing Spider-Man">
<style>
  
  .upper{animation:upArt 0.9s ease-in-out infinite alternate;transform-origin:129px 132px}
  .lower{animation:loArt 0.9s ease-in-out infinite alternate;transform-origin:129px 132px}
  @keyframes upArt{0%{transform:rotate(-7deg) translateY(2px)}100%{transform:rotate(7deg) translateY(-3px)}}
  @keyframes loArt{0%{transform:rotate(9deg)}100%{transform:rotate(-9deg)}}
  .spin{animation:sp 7s linear infinite;transform-origin:130px 130px}
  .spinR{animation:spR 9s linear infinite;transform-origin:130px 130px}
  @keyframes sp{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes spR{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
  .pulseAura{animation:pA 2.2s ease-in-out infinite;transform-origin:130px 130px}
  @keyframes pA{0%,100%{opacity:0.45;transform:scale(0.92)}50%{opacity:0.9;transform:scale(1.08)}}
  .zap1{animation:z1 0.75s ease-in-out infinite}
  .zap2{animation:z1 0.75s ease-in-out infinite;animation-delay:-0.38s}
  @keyframes z1{0%,100%{opacity:0.08;transform:scale(0.9)}50%{opacity:1;transform:scale(1.06)}}
  .shot{stroke-dasharray:65;animation:sh 0.75s linear infinite}
  @keyframes sh{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
  .glitch{animation:gl 1.4s steps(2,end) infinite}
  @keyframes gl{0%,100%{opacity:0;transform:translateX(0)}20%{opacity:0.85;transform:translateX(-6px)}40%{opacity:0;transform:translateX(6px)}60%{opacity:0.7;transform:translateX(4px)}}

  
  .macro{animation:mBg2 1.85s ease-in-out infinite;transform-origin:130px 6px}
  @keyframes mBg2{
    0%,100%{transform:translateY(-16px) rotate(10deg)}
    25%{transform:translateY(4px) rotate(-9deg)}
    50%{transform:translateY(18px) rotate(8deg)}
    75%{transform:translateY(2px) rotate(-10deg)}
  }
</style>

  <defs>
    <radialGradient id="gSq"><stop offset="0" stop-color="#2563EB" stop-opacity="0.38"/><stop offset="0.6" stop-color="#EF4444" stop-opacity="0.16"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
  </defs>
  <circle class="pulseAura" cx="130" cy="130" r="96" fill="url(#gSq)"/>
  <g class="spin">
    <circle cx="130" cy="130" r="84" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="16 8" stroke-opacity="0.55"/>
  </g>
  <!-- Overhead Web Canopy -->
  <path d="M70 6 Q130 28 190 6 M90 6 Q130 20 170 6" fill="none" stroke="#64748B" stroke-width="1.8"/>
<g class="macro">
  <line x1="130" y1="6" x2="130" y2="60" stroke="#64748B" stroke-width="2.5"/>
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  
  <path class="zap1" d="M76 184 q-14 8 0 18 M62 178 q-18 12 0 26 M184 184 q14 8 0 18 M198 178 q18 12 0 26" fill="none" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round"/>
  <path class="zap2" d="M52 105 l20 12 l-10 12 l18 8 M208 105 l-20 12 l10 12 l-18 8" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
</g>
</svg>