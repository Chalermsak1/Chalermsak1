<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Miles Morales Leap">
<style>
  
  .upper{animation:upArt 0.9s ease-in-out infinite alternate;transform-origin:85px 132px}
  .lower{animation:loArt 0.9s ease-in-out infinite alternate;transform-origin:85px 132px}
  @keyframes upArt{0%{transform:rotate(-7deg) translateY(2px)}100%{transform:rotate(7deg) translateY(-3px)}}
  @keyframes loArt{0%{transform:rotate(9deg)}100%{transform:rotate(-9deg)}}
  .spin{animation:sp 7s linear infinite;transform-origin:130px 130px}
  .spinR{animation:spR 9s linear infinite;transform-origin:130px 130px}
  @keyframes sp{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes spR{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
  .pulseAura{animation:pA 2.2s ease-in-out infinite;transform-origin:130px 130px}
  @keyframes pA{0%,100%{opacity:0.45;transform:scale(0.92)}50%{opacity:0.9;transform:scale(1.08)}}
  .zap1{animation:z1 0.75s ease-in-out infinite}
  .zap2{animation:z1 0.75s ease-in-out infinite;animation-delay:-0.38s}
  @keyframes z1{0%,100%{opacity:0.08;transform:scale(0.9)}50%{opacity:1;transform:scale(1.06)}}
  .shot{stroke-dasharray:65;animation:sh 0.75s linear infinite}
  @keyframes sh{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
  .glitch{animation:gl 1.4s steps(2,end) infinite}
  @keyframes gl{0%,100%{opacity:0;transform:translateX(0)}20%{opacity:0.85;transform:translateX(-6px)}40%{opacity:0;transform:translateX(6px)}60%{opacity:0.7;transform:translateX(4px)}}

  
  .macro{animation:mSwL 1.75s ease-in-out infinite;transform-origin:55px 0px}
  @keyframes mSwL{0%,100%{transform:rotate(19deg) translate(-14px, 6px)}50%{transform:rotate(-21deg) translate(18px, -12px)}}
</style>

  <defs>
    <radialGradient id="gSent"><stop offset="0" stop-color="#0EA5E9" stop-opacity="0.38"/><stop offset="0.6" stop-color="#EF4444" stop-opacity="0.15"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient>
  </defs>
  <circle class="pulseAura" cx="130" cy="130" r="96" fill="url(#gSent)"/>
  <!-- Cyber Sentinel Web Shield -->
  <g class="spin">
    <polygon points="130,38 195,65 222,130 195,195 130,222 65,195 38,130 65,65" fill="none" stroke="#0EA5E9" stroke-width="1.8" stroke-dasharray="12 6" stroke-opacity="0.55"/>
    <circle cx="130" cy="130" r="68" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="8 8" stroke-opacity="0.45"/>
  </g>
<g class="macro">
  <line x1="55" y1="-10" x2="85" y2="132" stroke="#64748B" stroke-width="2.4" stroke-dasharray="6 3"/>
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  
  <!-- Bio-Electric Venom Lightning & Shooting Web -->
  <line class="shot" x1="158" y1="108" x2="242" y2="62" stroke="#0EA5E9" stroke-width="2.8" stroke-linecap="round"/>
  <path class="zap1" d="M175 82 l18 -14 l-8 16 l18 -6 M68 155 l-18 12 l8 -16 l-16 6" fill="none" stroke="#FACC15" stroke-width="2.8" stroke-linecap="round"/>
  <path class="zap2" d="M112 72 l14 -16 l-4 18 l14 -8 M148 155 l16 14 l-10 -16 l16 4" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round"/>
</g>
</svg>