<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Spider-Ham">
<style>
  
  .macro{animation:mCb 1.45s ease-in-out infinite;transform-origin:130px 215px}
  @keyframes mCb{
    0%,100%{transform:translateY(10px) scale(1.09, 0.90) rotate(0deg)}
    30%{transform:translateY(-26px) scale(0.93, 1.08) rotate(-9deg)}
    65%{transform:translateY(-18px) scale(0.96, 1.05) rotate(9deg)}
  }
  .upper{animation:upArt 0.92s ease-in-out infinite alternate;transform-origin:129px 137px}
  .lower{animation:loArt 0.92s ease-in-out infinite alternate;transform-origin:129px 137px}
  @keyframes upArt{
    0%{transform:rotate(-7deg) translateY(2px)}
    100%{transform:rotate(7deg) translateY(-3px)}
  }
  @keyframes loArt{
    0%{transform:rotate(9deg)}
    100%{transform:rotate(-9deg)}
  }
  .vfx{animation:vf 0.9s ease-in-out infinite}
  @keyframes vf{0%,100%{opacity:0.15;transform:scale(0.92)}50%{opacity:0.95;transform:scale(1.08)}}
  .shot{stroke-dasharray:55;animation:sh 0.85s linear infinite}
  @keyframes sh{from{stroke-dashoffset:110}to{stroke-dashoffset:0}}
  .ring{animation:rg 2.8s linear infinite;transform-origin:130px 135px}
  @keyframes rg{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
<g class="macro">
  <ellipse class="shdw" cx="130" cy="228" rx="48" ry="8" fill="#0F172A" opacity="0.25"/>
  <g class="lower">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <g class="upper">
    <image x="0" y="0" width="260" height="260" xlink:href="data:image/png;base64,"/>
  </g>
  <path class="vfx" d="M78 42 q-14 -10 -4 -22 M182 42 q14 -10 4 -22" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
</g>
</svg>